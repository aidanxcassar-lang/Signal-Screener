# Netlify configuration for $ignal Screener
# Single self-contained index.html plus PWA assets. No build step.

[build]
  publish = "."
  # A real command that always succeeds. An empty string can let Netlify fall back to
  # auto-detection, which sees package.json and tries `npm run build`.
  command = "echo 'no build step required'"
  functions = "netlify/functions"

# Score-change alerts. This is what makes them work while the user's browser is closed.
# Change the cron here and in the `config` export of check-alerts.js if you move the time.
[functions."check-alerts"]
  schedule = "0 8 * * *"

# Refreshes the figures behind the coin reports. Runs an hour before the alert job so
# alerts see current data. Must be declared here as well as in the function's config
# export, or Netlify will not schedule it.
[functions."refresh-reports"]
  schedule = "0 7 * * *"

[functions]
  node_bundler = "esbuild"

# NOTE: deliberately no Content-Security-Policy header.
# A restrictive `connect-src` is exactly what breaks live data. If you add a CSP later you
# MUST allowlist every data host: api.coingecko.com, api.coinpaprika.com,
# min-api.cryptocompare.com, api.binance.com, api.exchange.coinbase.com, api.kraken.com,
# api.llama.fi, api.github.com, ungh.cc, api.ethplorer.io, api.anthropic.com,
# cdnjs.cloudflare.com, cdn.jsdelivr.net, unpkg.com, and the CORS proxy fallbacks.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# The HTML must never be cached, or users get a stale build after each deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker must always revalidate, otherwise an old worker pins an old app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Report routes. Declared here rather than with a config.path array in the function, which
# is not reliably supported. status = 200 rewrites, so the URL the visitor sees is kept.
[[redirects]]
  from = "/crypto-scores"
  to = "/.netlify/functions/reports"
  status = 200

[[redirects]]
  from = "/coins/:slug"
  to = "/.netlify/functions/reports?slug=:slug"
  status = 200
